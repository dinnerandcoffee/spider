name: Temporary TrainStopMeter APK Build

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct and verify project archive
        run: |
          cat tsm_parts/part00.txt tsm_parts/mid00.txt tsm_parts/mid01.txt tsm_parts/mid02.txt tsm_parts/mid03.txt tsm_parts/part02.txt > TrainStopMeter_v1_sdk36.b64
          base64 -d TrainStopMeter_v1_sdk36.b64 > TrainStopMeter_v1_sdk36.zip
          echo "f0353fc079643a58cedaeef1373658ecbbc23c5449f22bc4481cc118f09257cd  TrainStopMeter_v1_sdk36.zip" | sha256sum -c -
          unzip -q TrainStopMeter_v1_sdk36.zip

      - name: Apply v1.1 administrator entry fix
        run: python3 trainstopmeter_patch_v11.py

      - name: Build debug APK
        working-directory: TrainStopMeter_v1
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp TrainStopMeter_v1/app/build/outputs/apk/debug/app-debug.apk TrainStopMeter-v1.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrainStopMeter-v1.1-APK
          path: TrainStopMeter-v1.1-debug.apk
